<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lucky Draw Lottery</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================= -->
<!-- OVERALL GAME CONTAINER -->
<!-- ============================= -->
<div id="game-container" align="center">

    <!-- ============================= -->
    <!-- GAME TITLE / HEADER -->
    <!-- ============================= -->
    <header id="game-title">
        <h1>🎰 Lucky Draw Lottery 🎰</h1>
        <p>Pick 6 numbers and test your luck!</p>
    </header>

    <!-- ============================= -->
    <!-- INPUT SECTION -->
    <!-- ============================= -->
    

    <!-- ============================= -->
    <!-- RESULTS SECTION -->
    <!-- ============================= -->
    <section id="results-section">
        <h2>Game Results</h2>

        <!-- Player numbers -->
        <p>
            <strong>Your Numbers:</strong>
            <span id="player-numbers">---</span>
        </p>

        <!-- Lottery numbers -->
        <p>
            <strong>Lottery Numbers:</strong>
            <span id="lottery-numbers">---</span>
        </p>

        <!-- Match count -->
        <p>
            <strong>Matches:</strong>
            <span id="match-count">0</span>
        </p>

        <!-- Prize display -->
        <p>
            <strong>Prize:</strong>
            <span id="prize-display">---</span>
        </p>

        <!-- Play again button -->
        <button id="play-again-btn">🔁 Play Again</button>
    </section>

</div>

<!-- External JS -->
<script src="script.js"></script>

</body>
</html>
